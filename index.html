<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax Adventure</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:white}
.hero{height:100vh;display:flex;align-items:center;justify-content:center;background:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1920') center/cover fixed}
h1{font-size:4rem;text-shadow:0 0 20px black}
.section{padding:80px 10%;text-align:center}
.card{background:#222;padding:20px;border-radius:12px;margin:20px auto;max-width:700px}
.parallax{height:100vh;display:flex;align-items:center;justify-content:center;background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1920') center/cover fixed}
</style>
</head>
<body>
<div class="hero"><h1>PARALLAX ADVENTURE</h1></div>
<div class="section">
<h2>Explore the Journey</h2>
<div class="card">Smooth parallax scrolling effect.</div>
<div class="card">Modern design and immersive experience.</div>
</div>
<div class="parallax"><h1>Into the Mountains</h1></div>
</body>
</html>
